:root {
  --brand: #2a8d78;
  --brand-600: #257c69;
  --brand-700: #1e6556;
  --brand-deep: #0f3d34;
  --brand-ink: #0a2a24;
  --brand-100: #d9efe9;
  --brand-200: #b6e1d6;
  --brand-soft: #eaf6f2;
  --accent: #f5d020;
  --accent-ink: #67570d;
  --accent-soft: #fdf6d2;
  --surface: #ffffff;
  --page: #f3f9f7;
  --ink: #12211d;
  --ink-2: #4f625d;
  --ink-3: #8a9995;
  --line: #dcebe6;
  --good: #0ca30c;
  --warn: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --radius: 18px;
}
html {
  scroll-behavior: smooth;
}
body {
  background: var(--page);
  color: var(--ink);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, .font-display {
  font-family: var(--font-display);
  letter-spacing: -0.01em;
}
@layer components {
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 1px 2px rgba(15, 61, 52, 0.04), 0 8px 24px -16px rgba(15, 61, 52, 0.25);
  }
  .input {
    width: 100%;
    border: 1.5px solid var(--line);
    background: #fff;
    border-radius: 12px;
    padding: 11px 14px;
    font-size: 15px;
    color: var(--ink);
    outline: none;
    transition: border-color 150ms ease, box-shadow 150ms ease;
  }
  .input:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 4px var(--brand);
    @supports (color: color-mix(in lab, red, red)) {
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 16%, transparent);
    }
  }
  .input::placeholder {
    color: var(--ink-3);
  }
}
.bg-brand-gradient {
  background: linear-gradient(135deg, var(--brand-deep) 0%, var(--brand-700) 55%, var(--brand) 100%);
}
.bg-hero {
  background: radial-gradient(1200px 600px at 85% -10%, var(--brand), transparent 60%),
    radial-gradient(700px 500px at -10% 110%, var(--accent), transparent 60%),
    linear-gradient(160deg, var(--brand-ink) 0%, var(--brand-deep) 50%, var(--brand-700) 100%);
  @supports (color: color-mix(in lab, red, red)) {
    background: radial-gradient(1200px 600px at 85% -10%, color-mix(in srgb, var(--brand) 55%, transparent), transparent 60%),
    radial-gradient(700px 500px at -10% 110%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%),
    linear-gradient(160deg, var(--brand-ink) 0%, var(--brand-deep) 50%, var(--brand-700) 100%);
  }
}
.text-gradient {
  background: linear-gradient(90deg, var(--brand-200), #ffffff 60%, var(--accent));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.card-lift {
  transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
}
.card-lift:hover {
  transform: translateY(-2px);
  box-shadow: 0 2px 4px rgba(15, 61, 52, 0.05), 0 18px 32px -18px rgba(15, 61, 52, 0.35);
  border-color: var(--brand-200);
}
.ring-brand {
  box-shadow: 0 0 0 4px var(--brand);
  @supports (color: color-mix(in lab, red, red)) {
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 18%, transparent);
  }
}
@keyframes flicker {
  0%, 100% {
    transform: scale(1) rotate(-1deg);
    filter: brightness(1);
  }
  40% {
    transform: scale(1.04) rotate(1.5deg);
    filter: brightness(1.12);
  }
  70% {
    transform: scale(0.98) rotate(-0.5deg);
    filter: brightness(0.96);
  }
}
.flame {
  animation: flicker 1.6s ease-in-out infinite;
  transform-origin: 50% 90%;
}
@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.rise {
  animation: rise 500ms ease both;
}
.rise-2 {
  animation: rise 500ms 120ms ease both;
}
.rise-3 {
  animation: rise 500ms 240ms ease both;
}
.rise-4 {
  animation: rise 500ms 360ms ease both;
}
@keyframes pulse-line {
  0% {
    stroke-dashoffset: 1900;
  }
  70% {
    stroke-dashoffset: 0;
  }
  100% {
    stroke-dashoffset: 0;
  }
}
.ecg {
  stroke-dasharray: 1900;
  animation: pulse-line 6s linear infinite;
}
@keyframes shimmer {
  0% {
    background-position: -200% 0;
  }
  100% {
    background-position: 200% 0;
  }
}
.shimmer {
  background: linear-gradient(90deg, var(--brand-soft) 25%, #ffffff 50%, var(--brand-soft) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.8s linear infinite;
}
@media (prefers-reduced-motion: reduce) {
  .flame, .rise, .rise-2, .rise-3, .rise-4, .ecg, .shimmer {
    animation: none;
  }
}
.tabular {
  font-variant-numeric: tabular-nums;
}
::selection {
  background: var(--accent);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in srgb, var(--accent) 60%, #fff);
  }
}
